<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>كتاب — قارئ تفاعلي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Rakkas&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink-green:      #0f3d2e;
    --ink-green-dark: #081f17;
    --gold:           #b8934b;
    --gold-bright:    #d8b872;
    --parchment:      #f3ecdd;
    --parchment-dark: #e6dcc4;
    --charcoal:       #262220;
    --sage:           #6b8f7c;
    --shadow-deep:    rgba(8,31,23,0.55);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at center, #12251d 0%, #071410 100%);
    font-family:'Inter', sans-serif;
    color:var(--parchment);
    overflow:hidden;
  }

  /* ---------- Loading screen ---------- */
  #loading{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #12251d 0%, #071410 100%);
    transition:opacity .6s ease;
  }
  #loading.hide{ opacity:0; pointer-events:none; }
  .ornament{
    width:56px; height:56px; margin-bottom:22px;
    border:2px solid var(--gold);
    border-radius:50%;
    position:relative;
    animation:spin 2.4s linear infinite;
  }
  .ornament::before, .ornament::after{
    content:''; position:absolute; inset:8px;
    border:1px solid var(--gold-bright);
    border-radius:50%;
    opacity:.6;
  }
  .ornament::after{ inset:16px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading-text{ font-family:'Amiri', serif; font-size:1.05rem; letter-spacing:.04em; color:var(--gold-bright); }
  #loading-sub{ margin-top:6px; font-size:.8rem; color:var(--sage); font-family:'Inter',sans-serif; }
  #progress-track{
    width:220px; height:2px; margin-top:20px;
    background:rgba(184,147,75,.25); border-radius:2px; overflow:hidden;
  }
  #progress-bar{ width:0%; height:100%; background:var(--gold-bright); transition:width .2s ease; }

  /* ---------- Top bar ---------- */
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    background:linear-gradient(to bottom, rgba(7,20,16,.85), transparent);
    pointer-events:none;
  }
  #topbar > *{ pointer-events:auto; }
  #book-title{
    font-family:'Rakkas', serif; font-size:1.1rem; color:var(--gold-bright);
    letter-spacing:.02em;
    text-shadow:0 1px 6px rgba(0,0,0,.5);
    text-decoration:none; display:inline-block;
  }
  #book-title:hover{ color:var(--parchment); }
  #book-title span{
    display:block; font-family:'Inter',sans-serif; font-size:.65rem; color:var(--sage);
    letter-spacing:.12em; text-transform:uppercase; margin-top:2px;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(184,147,75,.4);
    background:rgba(15,61,46,.55);
    color:var(--gold-bright);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.2s;
    backdrop-filter:blur(4px);
  }
  .icon-btn:hover{ background:var(--gold); color:var(--ink-green-dark); border-color:var(--gold); }
  .icon-btn:disabled{ opacity:.35; cursor:default; }
  .icon-btn:disabled:hover{ background:rgba(15,61,46,.55); color:var(--gold-bright); border-color:rgba(184,147,75,.4); }
  .icon-btn svg{ width:17px; height:17px; }

  /* Mirror the prev/next chevrons in RTL so they point toward book-start / book-forward correctly */
  html[dir="rtl"] #btn-prev svg,
  html[dir="rtl"] #btn-next svg{ transform:scaleX(-1); }

  /* ---------- Book stage ---------- */
  #stage{
    height:100%; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding:70px 20px 96px;
    overflow:hidden;
  }
  /* Only becomes scrollable while zoomed in (so the enlarged page can be
     panned). Left as overflow:hidden otherwise — a cover page (single,
     narrow) and a two-page spread have different widths, and letting the
     stage scroll at all times caused a scrollbar to appear/disappear on
     every single flip, which is what was producing the page-jump. */
  #stage.zoomed{ overflow:auto; }
  /* #flip-outer is a wrapper WE fully control, separate from #flipbook
     (which St.PageFlip manages internally and sets its own inline styles
     on). Putting the mirror/zoom transform here instead of on #flipbook
     avoids it being silently overwritten by the library's own layout code
     — that was the cause of the earlier "mirrors for a split second then
     reverts" bug. Each page's own CANVAS gets an individual counter-mirror
     (set in JS, see renderPageAt) instead of the parent .page div, for the
     same reason — the library manages .page's transform directly for the
     fold/flip animation, so anything we put there gets clobbered too.
     No CSS transition here: a transitioned transform can make browsers
     composite from a cached, lower-resolution layer rather than
     re-rasterizing at the new scale, which was very likely the cause of
     zoom still looking soft/pixelated even though the canvas itself was
     re-rendered at higher resolution. */
  #flip-outer{
    transform: scaleX(var(--mirror-x, 1)) scale(var(--zoom, 1));
    transform-origin:center center;
    flex-shrink:0;
  }
  #flipbook{
    box-shadow:0 40px 90px var(--shadow-deep), 0 0 0 1px rgba(184,147,75,.15);
    border-radius:2px;
  }

  .page{
    background:var(--parchment);
    overflow:hidden;
  }
  .page canvas{ width:100%; height:100%; display:block; }
  .page-loading{
    position:absolute; inset:0;
    background:var(--parchment);
    display:flex; align-items:center; justify-content:center;
    color:var(--sage); font-size:.75rem; font-family:'Inter',sans-serif;
  }

  /* ---------- Bottom bar ---------- */
  #bottombar{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:center; gap:18px;
    padding:16px 22px 20px;
    background:linear-gradient(to top, rgba(7,20,16,.9), transparent);
  }
  #page-indicator{
    font-family:'Amiri', serif; font-size:.95rem; color:var(--gold-bright);
    min-width:96px; text-align:center; user-select:none;
  }
  #page-indicator b{
    color:var(--parchment); font-weight:600; cursor:pointer;
    border-bottom:1px dotted rgba(184,147,75,.6); padding-bottom:1px;
  }
  #page-indicator b:hover{ color:var(--gold-bright); }
  #page-input{
    display:none; width:52px; text-align:center;
    font-family:'Amiri', serif; font-size:.95rem; color:var(--parchment);
    background:rgba(184,147,75,.12); border:1px solid rgba(184,147,75,.5);
    border-radius:4px; padding:2px 4px;
  }
  input[type=range]{
    -webkit-appearance:none; width:180px; height:3px;
    background:rgba(184,147,75,.3); border-radius:3px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--gold-bright); cursor:pointer; box-shadow:0 0 0 3px rgba(216,184,114,.2);
  }

  /* ---------- Table of contents panel ---------- */
  #toc-overlay{
    position:fixed; inset:0; z-index:30;
    background:rgba(4,12,9,.55);
    display:none;
    backdrop-filter:blur(2px);
  }
  #toc-overlay.show{ display:block; }
  #toc-panel{
    position:fixed; top:0; bottom:0; width:min(340px, 84vw);
    background:linear-gradient(180deg, #0d3527 0%, #081f17 100%);
    border-inline-start:1px solid rgba(184,147,75,.3);
    box-shadow:-30px 0 60px rgba(0,0,0,.4);
    padding:20px 18px 20px;
    overflow-y:auto;
    inset-inline-end:0;
  }
  #toc-panel h2{
    font-family:'Rakkas', serif; color:var(--gold-bright); font-size:1.15rem;
    margin:4px 0 16px; padding-bottom:12px; border-bottom:1px solid rgba(184,147,75,.25);
  }
  .toc-empty{ color:var(--sage); font-size:.85rem; font-family:'Inter',sans-serif; direction:ltr; text-align:start; }
  .toc-list{ list-style:none; margin:0; padding:0; }
  .toc-list ul{ list-style:none; padding-inline-start:16px; margin:2px 0 2px; }
  .toc-item{
    display:block; width:100%; text-align:start; background:none; border:none;
    color:var(--parchment); font-family:'Amiri', serif; font-size:.95rem;
    padding:7px 4px; cursor:pointer; border-radius:4px; line-height:1.4;
  }
  .toc-item:hover{ background:rgba(184,147,75,.15); color:var(--gold-bright); }

  /* ---------- No-file state ---------- */
  #empty-state{
    position:fixed; inset:0; z-index:10;
    display:none; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; padding:40px;
  }
  #empty-state.show{ display:flex; }
  #empty-state h1{ font-family:'Rakkas',serif; color:var(--gold-bright); font-size:1.6rem; margin:0 0 10px; }
  #empty-state p{ font-family:'Inter',sans-serif; color:var(--sage); max-width:420px; line-height:1.6; font-size:.9rem; direction:ltr; }
  #empty-state code{ background:rgba(184,147,75,.15); padding:2px 7px; border-radius:4px; color:var(--gold-bright); }

  @media (max-width:640px){
    #book-title{ font-size:.9rem; }
    input[type=range]{ width:110px; }
    #stage{ padding:60px 8px 90px; }
    #topbar > div{ gap:6px !important; }
    .icon-btn{ width:34px; height:34px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="ornament"></div>
  <div id="loading-text">جارٍ تحميل الكتاب</div>
  <div id="loading-sub">Preparing pages…</div>
  <div id="progress-track"><div id="progress-bar"></div></div>
</div>

<div id="topbar">
  <a id="book-title" href="https://a-alqasim.com/" target="_blank" rel="noopener">كتب مجلس السماع<span>a-alqasim.com</span></a>
  <div style="display:flex; gap:8px;">
    <button class="icon-btn" id="btn-zoom-out" title="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="icon-btn" id="btn-zoom-in" title="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="icon-btn" id="btn-toc" title="Table of contents" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
    </button>
    <button class="icon-btn" id="btn-fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </div>
</div>

<div id="stage">
  <div id="flip-outer">
    <div id="flipbook"></div>
  </div>
</div>

<div id="empty-state">
  <h1>لا يوجد كتاب محمّل — No book loaded</h1>
  <p>Place your PDF next to this file and name it <code>book.pdf</code>, or add <code>?pdf=yourfile.pdf</code> to the URL. See README.md for full GitHub Pages deployment steps.</p>
</div>

<div id="toc-overlay">
  <div id="toc-panel">
    <h2>الفهرس — Contents</h2>
    <div id="toc-body"><div class="toc-empty">Loading…</div></div>
  </div>
</div>

<div id="bottombar">
  <button class="icon-btn" id="btn-prev" title="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div id="page-indicator"><b id="cur-page" title="Click to jump to a page">1</b><input type="number" id="page-input" min="1"> / <span id="total-pages">—</span></div>
  <input type="range" id="page-slider" min="1" max="1" value="1">
  <button class="icon-btn" id="btn-next" title="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
(function(){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const params = new URLSearchParams(location.search);
  const PDF_URL = params.get('pdf') || 'book.pdf';
  const RENDER_SCALE = 2.0;
  const DISABLE_MIRROR = params.get('mirror') === '0';

  const loadingEl = document.getElementById('loading');
  const progressBar = document.getElementById('progress-bar');
  const loadingSub = document.getElementById('loading-sub');
  const emptyState = document.getElementById('empty-state');
  const flipbookEl = document.getElementById('flipbook');
  const flipOuterEl = document.getElementById('flip-outer');
  const stageEl = document.getElementById('stage');
  const curPageEl = document.getElementById('cur-page');
  const pageInput = document.getElementById('page-input');
  const totalPagesEl = document.getElementById('total-pages');
  const slider = document.getElementById('page-slider');
  const tocOverlay = document.getElementById('toc-overlay');
  const tocBody = document.getElementById('toc-body');
  const btnToc = document.getElementById('btn-toc');

  let pageFlip = null;
  let numPages = 0;
  let dir = 'ltr';
  let pdfDoc = null;
  let pageDivs = [];
  let currentLogicalIdx = 0;

  // ---- Zoom: re-renders the PDF page itself at higher resolution (not a
  // CSS stretch of the existing bitmap), so zooming in stays crisp on a
  // vector-based PDF instead of pixelating like browser/CSS zoom does. ----
  const ZOOM_STEPS = [1, 1.5, 2, 2.5, 3];
  let zoomIndex = 0;
  const renderedScale = new Map(); // logicalIdx -> scale it was last rendered at

  function currentScale() { return RENDER_SCALE * ZOOM_STEPS[zoomIndex]; }

  // ---- Lazy loading strategy for very large books (this PDF: 1124 pages) ----
  // Load the first 50 pages up front (page 1 shows the instant it's ready,
  // the rest of that batch renders in the background), then keep buffering
  // 25 pages ahead of wherever the reader currently is — so by the time
  // they've read to page 25, pages up to 75 are already there, and so on.
  // Pages far BEHIND the current position are evicted back to placeholders
  // to keep memory bounded even after reading hundreds of pages forward.
  const INITIAL_BATCH = 50;
  const PREFETCH_CHUNK = 25;
  let loadedUpTo = -1; // highest logical index rendered/prefetched so far

  function keepBehind() { return zoomIndex === 0 ? 60 : 20; }   // pages kept behind current position
  function hardCap() { return zoomIndex === 0 ? 140 : 40; }     // absolute safety ceiling on rendered pages

  const RTL_SCRIPT = /[\u0591-\u07FF\uFB1D-\uFDFD\uFE70-\uFEFC]/g;
  const LTR_SCRIPT = /[A-Za-z]/g;
  const RTL_LANGS = ['ar','he','fa','ur','yi','ps','sd','ug'];

  async function detectDirection(pdf) {
    try {
      const vp = await pdf.getViewerPreferences?.();
      console.log('[flipbook] getViewerPreferences() ->', vp);
      if (vp && vp.Direction) {
        console.log('[flipbook] direction from ViewerPreferences:', vp.Direction);
        return vp.Direction === 'R2L' ? 'rtl' : 'ltr';
      }
    } catch (e) { console.log('[flipbook] getViewerPreferences() failed:', e); }

    try {
      let rtlCount = 0, ltrCount = 0, docLang = null;
      const pagesToSample = Math.min(pdf.numPages, 3);
      for (let i = 1; i <= pagesToSample; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        if (!docLang && tc.lang) docLang = tc.lang.toLowerCase();
        const text = tc.items.map(it => it.str).join(' ');
        rtlCount += (text.match(RTL_SCRIPT) || []).length;
        ltrCount += (text.match(LTR_SCRIPT) || []).length;
      }
      console.log('[flipbook] docLang:', docLang, ' rtlChars:', rtlCount, ' ltrChars:', ltrCount);
      if (docLang && RTL_LANGS.some(l => docLang.startsWith(l))) return 'rtl';
      if (rtlCount + ltrCount > 0) return rtlCount > ltrCount ? 'rtl' : 'ltr';
    } catch (e) { console.log('[flipbook] text-sampling failed (likely no text layer):', e); }

    console.log('[flipbook] no signal found, defaulting to ltr');
    return 'ltr';
  }

  async function renderPageAt(pdf, logicalIdx0, scale) {
    const page = await pdf.getPage(logicalIdx0 + 1);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    if (dir === 'rtl' && !DISABLE_MIRROR) canvas.style.transform = 'scaleX(-1)';
    return canvas;
  }

  // Renders a single logical page into its placeholder div, but only if it
  // isn't already rendered at the current zoom scale (cheap no-op otherwise).
  async function ensurePageRendered(pdf, logicalIdx0) {
    if (logicalIdx0 < 0 || logicalIdx0 >= numPages) return;
    const scale = currentScale();
    if (renderedScale.get(logicalIdx0) === scale) return;
    const canvas = await renderPageAt(pdf, logicalIdx0, scale);
    const el = pageDivs[logicalIdx0];
    el.innerHTML = '';
    el.appendChild(canvas);
    renderedScale.set(logicalIdx0, scale);
  }

  // Evicts pages far behind the current reading position back to an empty
  // placeholder, freeing their canvas memory. Essential for a 1000+ page
  // book once the reader has moved hundreds of pages forward — without
  // this, everything ever rendered would stay in memory indefinitely.
  function trimBehind(centerIdx) {
    const lowerBound = centerIdx - keepBehind();
    for (const idx of [...renderedScale.keys()]) {
      if (idx < lowerBound) {
        pageDivs[idx].innerHTML = '<div class="page-loading">…</div>';
        renderedScale.delete(idx);
      }
    }
    // Absolute safety net regardless of position, in case of pathological
    // jumps (e.g. rapid TOC clicking) — keeps only the pages closest to
    // the current one if the count ever balloons past the hard cap.
    if (renderedScale.size > hardCap()) {
      const farthestFirst = [...renderedScale.keys()].sort(
        (a, b) => Math.abs(b - centerIdx) - Math.abs(a - centerIdx)
      );
      for (const idx of farthestFirst) {
        if (renderedScale.size <= hardCap()) break;
        pageDivs[idx].innerHTML = '<div class="page-loading">…</div>';
        renderedScale.delete(idx);
      }
    }
  }

  // Renders pages sequentially up to (and including) targetIdx, advancing
  // the "loaded frontier". Safe to call repeatedly — resumes from wherever
  // it left off rather than restarting.
  async function prefetchForward(pdf, targetIdx) {
    targetIdx = Math.min(targetIdx, numPages - 1);
    for (let i = loadedUpTo + 1; i <= targetIdx; i++) {
      await ensurePageRendered(pdf, i);
      loadedUpTo = Math.max(loadedUpTo, i);
      trimBehind(currentLogicalIdx);
    }
  }

  // Called whenever the reader's position changes: extends the loaded
  // frontier by another chunk once the reader gets within one chunk's
  // length of the edge of what's already loaded.
  function maybeExtendFrontier(pdf, centerIdx) {
    if (centerIdx + PREFETCH_CHUNK >= loadedUpTo) {
      prefetchForward(pdf, loadedUpTo + PREFETCH_CHUNK); // background, not awaited
    }
  }

  // Runs on every page change (flip event or jump): makes sure the page
  // you've landed on is actually rendered, keeps the forward buffer topped
  // up, and evicts anything now far behind.
  async function onPageChanged(pdf, logicalIdx0) {
    currentLogicalIdx = logicalIdx0;
    await ensurePageRendered(pdf, logicalIdx0);
    maybeExtendFrontier(pdf, logicalIdx0);
    trimBehind(logicalIdx0);
  }

  async function setZoom(newIndex) {
    newIndex = Math.max(0, Math.min(ZOOM_STEPS.length - 1, newIndex));
    if (newIndex === zoomIndex) return;
    zoomIndex = newIndex;
    flipOuterEl.style.setProperty('--zoom', ZOOM_STEPS[zoomIndex]);
    stageEl.classList.toggle('zoomed', zoomIndex > 0);
    document.getElementById('btn-zoom-in').disabled = zoomIndex === ZOOM_STEPS.length - 1;
    document.getElementById('btn-zoom-out').disabled = zoomIndex === 0;
    // Refresh the page(s) the reader is actually looking at immediately, at
    // the new resolution — current page plus its spread neighbor, since a
    // two-page spread shows two logical pages at once.
    await ensurePageRendered(pdfDoc, currentLogicalIdx);
    await ensurePageRendered(pdfDoc, currentLogicalIdx - 1);
    await ensurePageRendered(pdfDoc, currentLogicalIdx + 1);
    trimBehind(currentLogicalIdx);
  }

  // NOTE on the RTL scheme (after two failed attempts, here's the corrected
  // reasoning): the flip library's page index always progresses in the
  // SAME order you feed it, regardless of any CSS mirroring — flipNext()
  // always means "go to the next array index." Mirroring the container
  // only changes how that transition LOOKS (which side pages accumulate
  // on, which way the fold curls); it does not require reordering the
  // pages you feed in. Reversing the array was unnecessary and is the most
  // likely cause of the binding still being wrong after the CSS mirror was
  // confirmed to be applying correctly. So: pages are now fed in their
  // natural order for both directions, and "forward" is always flipNext().
  // Only the keyboard-arrow mapping (further down) still depends on `dir`,
  // since that's genuinely about which physical key means "forward" once
  // the visual is mirrored.
  function logicalToLibraryIndex(logicalIdx0) { return logicalIdx0; }
  function libraryToLogicalIndex(libraryIdx0) { return libraryIdx0; }
  function goForward() { pageFlip.flipNext(); }
  function goBackward() { pageFlip.flipPrev(); }

  // Used by the TOC, the page slider, and the editable page number to jump
  // straight to a page: makes sure that page is actually rendered
  // before/while flipping to it, since with lazy rendering a distant page
  // may not have a canvas yet.
  async function jumpToLogical(logicalIdx0) {
    logicalIdx0 = Math.max(0, Math.min(numPages - 1, logicalIdx0));
    await ensurePageRendered(pdfDoc, logicalIdx0);
    pageFlip.flip(logicalToLibraryIndex(logicalIdx0));
    onPageChanged(pdfDoc, logicalIdx0);
  }

  async function buildTOC(pdf) {
    let outline;
    try { outline = await pdf.getOutline(); } catch (e) { outline = null; }
    if (!outline || outline.length === 0) {
      tocBody.innerHTML = '<div class="toc-empty">This PDF has no bookmarks/outline to build a table of contents from.</div>';
      return;
    }
    btnToc.disabled = false;

    async function resolve(nodes) {
      const ul = document.createElement('ul');
      ul.className = 'toc-list';
      for (const node of nodes) {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'toc-item';
        btn.textContent = node.title || '(untitled)';

        let logicalIdx0 = null;
        try {
          let dest = node.dest;
          if (typeof dest === 'string') dest = await pdf.getDestination(dest);
          if (Array.isArray(dest) && dest[0] != null) {
            logicalIdx0 = await pdf.getPageIndex(dest[0]);
          }
        } catch (e) {}

        if (logicalIdx0 !== null) {
          btn.addEventListener('click', () => {
            jumpToLogical(logicalIdx0);
            tocOverlay.classList.remove('show');
          });
        } else {
          btn.disabled = true;
          btn.style.opacity = '.4';
        }
        li.appendChild(btn);
        if (node.items && node.items.length) li.appendChild(await resolve(node.items));
        ul.appendChild(li);
      }
      return ul;
    }

    tocBody.innerHTML = '';
    tocBody.appendChild(await resolve(outline));
  }

  async function init() {
    let pdf;
    try {
      pdf = await pdfjsLib.getDocument(PDF_URL).promise;
    } catch (e) {
      loadingEl.classList.add('hide');
      emptyState.classList.add('show');
      console.error('Could not load PDF:', e);
      return;
    }
    pdfDoc = pdf;

    numPages = pdf.numPages;
    totalPagesEl.textContent = numPages;
    slider.max = numPages;

    const forcedDir = params.get('dir');
    dir = (forcedDir === 'rtl' || forcedDir === 'ltr') ? forcedDir : await detectDirection(pdf);
    console.log('[flipbook] forcedDir:', forcedDir, ' final dir:', dir, ' DISABLE_MIRROR:', DISABLE_MIRROR, ' mirror-x applied:', (dir === 'rtl' && !DISABLE_MIRROR) ? -1 : 1);
    document.documentElement.setAttribute('dir', dir);
    flipOuterEl.style.setProperty('--mirror-x', (dir === 'rtl' && !DISABLE_MIRROR) ? -1 : 1);
    loadingSub.textContent = `Detected ${dir === 'rtl' ? 'right-to-left' : 'left-to-right'} binding…`;

    const firstPage = await pdf.getPage(1);
    const vp1 = firstPage.getViewport({ scale: 1 });
    const aspect = vp1.width / vp1.height;

    const maxH = Math.min(window.innerHeight - 170, 900);
    const singlePageHeight = maxH;
    const singlePageWidth = Math.round(singlePageHeight * aspect);

    pageFlip = new St.PageFlip(flipbookEl, {
      width: singlePageWidth,
      height: singlePageHeight,
      size: 'fixed',
      minWidth: 200,
      maxWidth: 1400,
      minHeight: 300,
      maxHeight: 1400,
      showCover: true,
      usePortrait: window.innerWidth < 760,
      maxShadowOpacity: 0.5,
      mobileScrollSupport: true,
      drawShadow: true,
      flippingTime: 700
    });

    // Build lightweight placeholder DOM only — pages are NOT rendered here.
    // For a 1000+ page book, rendering every page up front would take
    // minutes and likely exhaust the browser's memory; instead only a small
    // neighborhood around the current page is ever rendered at once.
    pageDivs = [];
    for (let i = 0; i < numPages; i++) {
      const placeholder = document.createElement('div');
      placeholder.className = 'page';
      placeholder.innerHTML = '<div class="page-loading">…</div>';
      pageDivs.push(placeholder);
    }
    // Pages are always loaded in natural order — see the note above
    // logicalToLibraryIndex for why reversing them was wrong.
    pageFlip.loadFromHTML(pageDivs);

    loadingSub.textContent = 'Rendering page 1…';
    await ensurePageRendered(pdf, 0);
    loadedUpTo = 0;
    currentLogicalIdx = 0;
    loadingEl.classList.add('hide');
    // First 50 pages load in the background; further chunks of 25 keep
    // buffering ahead automatically as the reader progresses (see
    // onPageChanged / maybeExtendFrontier).
    prefetchForward(pdf, INITIAL_BATCH - 1);

    pageFlip.on('flip', (e) => {
      const logicalIdx0 = libraryToLogicalIndex(e.data);
      curPageEl.textContent = logicalIdx0 + 1;
      slider.value = logicalIdx0 + 1;
      onPageChanged(pdf, logicalIdx0);
    });

    document.getElementById('btn-next').onclick = goForward;
    document.getElementById('btn-prev').onclick = goBackward;
    slider.addEventListener('input', () => {
      const logicalIdx0 = parseInt(slider.value, 10) - 1;
      jumpToLogical(logicalIdx0);
    });

    document.getElementById('btn-zoom-in').onclick = () => setZoom(zoomIndex + 1);
    document.getElementById('btn-zoom-out').onclick = () => setZoom(zoomIndex - 1);
    document.getElementById('btn-zoom-out').disabled = true;

    // Click the page number to type a page and jump straight to it.
    curPageEl.addEventListener('click', () => {
      pageInput.max = numPages;
      pageInput.value = curPageEl.textContent;
      curPageEl.style.display = 'none';
      pageInput.style.display = 'inline-block';
      pageInput.focus();
      pageInput.select();
    });
    function commitPageInput() {
      const v = parseInt(pageInput.value, 10);
      pageInput.style.display = 'none';
      curPageEl.style.display = '';
      if (!isNaN(v)) jumpToLogical(v - 1);
    }
    pageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commitPageInput();
      if (e.key === 'Escape') { pageInput.style.display = 'none'; curPageEl.style.display = ''; }
    });
    pageInput.addEventListener('blur', commitPageInput);

    // Right/left arrow keys always mean "forward"/"back" in reading order,
    // which is the OPPOSITE screen direction for an RTL book (forward
    // flips right-to-left, so the LEFT arrow key moves forward there).
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === pageInput) return; // don't hijack typing a page number
      if (e.key === 'ArrowRight') { dir === 'rtl' ? goBackward() : goForward(); }
      if (e.key === 'ArrowLeft')  { dir === 'rtl' ? goForward() : goBackward(); }
    });

    buildTOC(pdf);
  }

  document.getElementById('btn-fullscreen').onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  };
  btnToc.addEventListener('click', () => tocOverlay.classList.add('show'));
  tocOverlay.addEventListener('click', (e) => {
    if (e.target === tocOverlay) tocOverlay.classList.remove('show');
  });

  init();
})();
</script>

</body>
