<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>كتاب — قارئ تفاعلي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Rakkas&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink-green:      #0f3d2e;
    --ink-green-dark: #081f17;
    --gold:           #b8934b;
    --gold-bright:    #d8b872;
    --parchment:      #f3ecdd;
    --parchment-dark: #e6dcc4;
    --charcoal:       #262220;
    --sage:           #6b8f7c;
    --shadow-deep:    rgba(8,31,23,0.55);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background-color: #f7f1e2;
    background-image:
      repeating-linear-gradient(45deg, rgba(184,147,75,0.08) 0, rgba(184,147,75,0.08) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(-45deg, rgba(184,147,75,0.08) 0, rgba(184,147,75,0.08) 1px, transparent 1px, transparent 26px);
    font-family:'Inter', sans-serif;
    color:var(--charcoal);
    overflow:hidden;
  }

  /* ---------- Loading screen ---------- */
  #loading{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background-color: #f7f1e2;
    background-image:
      repeating-linear-gradient(45deg, rgba(184,147,75,0.08) 0, rgba(184,147,75,0.08) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(-45deg, rgba(184,147,75,0.08) 0, rgba(184,147,75,0.08) 1px, transparent 1px, transparent 26px);
    transition:opacity .6s ease;
  }
  #loading.hide{ opacity:0; pointer-events:none; }
  .ornament{
    width:56px; height:56px; margin-bottom:22px;
    border:2px solid var(--gold);
    border-radius:50%;
    position:relative;
    animation:spin 2.4s linear infinite;
  }
  .ornament::before, .ornament::after{
    content:''; position:absolute; inset:8px;
    border:1px solid var(--gold-bright);
    border-radius:50%;
    opacity:.6;
  }
  .ornament::after{ inset:16px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading-text{ font-family:'Amiri', serif; font-size:1.05rem; letter-spacing:.04em; color:var(--ink-green); }
  #loading-sub{ margin-top:6px; font-size:.8rem; color:#8a7550; font-family:'Inter',sans-serif; }
  #progress-track{
    width:220px; height:2px; margin-top:20px;
    background:rgba(184,147,75,.25); border-radius:2px; overflow:hidden;
  }
  #progress-bar{ width:0%; height:100%; background:var(--gold-bright); transition:width .2s ease; }

  /* ---------- Top bar ---------- */
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    background:linear-gradient(to bottom, rgba(7,20,16,.85), transparent);
    pointer-events:none;
  }
  #topbar > *{ pointer-events:auto; }
  #book-title{
    font-family:'Rakkas', serif; font-size:1.1rem; color:var(--gold-bright);
    letter-spacing:.02em;
    text-shadow:0 1px 6px rgba(0,0,0,.5);
    text-decoration:none; display:inline-block;
  }
  #book-title:hover{ color:var(--parchment); }
  #book-title span{
    display:block; font-family:'Inter',sans-serif; font-size:.65rem; color:var(--sage);
    letter-spacing:.12em; text-transform:uppercase; margin-top:2px;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(184,147,75,.4);
    background:rgba(15,61,46,.55);
    color:var(--gold-bright);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.2s;
    backdrop-filter:blur(4px);
  }
  .icon-btn:hover{ background:var(--gold); color:var(--ink-green-dark); border-color:var(--gold); }
  .icon-btn:disabled{ opacity:.35; cursor:default; }
  .icon-btn:disabled:hover{ background:rgba(15,61,46,.55); color:var(--gold-bright); border-color:rgba(184,147,75,.4); }
  .icon-btn svg{ width:17px; height:17px; }

  /* Mirror the prev/next chevrons in RTL so they point toward book-start / book-forward correctly */
  html[dir="rtl"] #btn-prev svg,
  html[dir="rtl"] #btn-next svg{ transform:scaleX(-1); }

  /* ---------- Book stage ---------- */
  #stage{
    height:100%; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding:70px 12px 96px;
    overflow:hidden;
  }
  /* #flip-outer is a wrapper WE fully control, separate from #flipbook
     (which St.PageFlip manages internally and sets its own inline styles
     on). Putting the mirror transform here instead of on #flipbook avoids
     it being silently overwritten by the library's own layout code. Each
     page's own CANVAS gets an individual counter-mirror (set in JS, see
     renderPageAt) instead of the parent .page div, for the same reason —
     the library manages .page's transform directly for the flip animation. */
  #flip-outer{
    transform: scaleX(var(--mirror-x, 1));
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #flipbook{
    box-shadow:0 40px 90px var(--shadow-deep), 0 0 0 1px rgba(184,147,75,.15);
    border-radius:2px;
    touch-action:pan-y; /* let vertical scroll through, we handle horizontal swipe ourselves */
  }

  .page{
    background:var(--parchment);
    overflow:hidden;
  }
  .page canvas{ width:100%; height:100%; display:block; }
  .page-loading{
    position:absolute; inset:0;
    background:var(--parchment);
    display:flex; align-items:center; justify-content:center;
    color:var(--sage); font-size:.75rem; font-family:'Inter',sans-serif;
  }

  /* ---------- Bottom bar ---------- */
  #bottombar{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:center; gap:18px;
    padding:16px 22px 20px;
    background:linear-gradient(to top, rgba(7,20,16,.9), transparent);
  }
  #page-indicator{
    font-family:'Amiri', serif; font-size:.95rem; color:var(--gold-bright);
    min-width:96px; text-align:center; user-select:none;
  }
  #page-indicator b{
    color:var(--parchment); font-weight:600; cursor:pointer;
    border-bottom:1px dotted rgba(184,147,75,.6); padding-bottom:1px;
  }
  #page-indicator b:hover{ color:var(--gold-bright); }
  #page-input{
    display:none; width:52px; text-align:center;
    font-family:'Amiri', serif; font-size:.95rem; color:var(--parchment);
    background:rgba(184,147,75,.12); border:1px solid rgba(184,147,75,.5);
    border-radius:4px; padding:2px 4px;
  }
  input[type=range]{
    -webkit-appearance:none; width:180px; height:3px;
    background:rgba(184,147,75,.3); border-radius:3px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--gold-bright); cursor:pointer; box-shadow:0 0 0 3px rgba(216,184,114,.2);
  }

  /* ---------- Table of contents panel ---------- */
  #toc-overlay{
    position:fixed; inset:0; z-index:30;
    background:rgba(4,12,9,.55);
    display:none;
    backdrop-filter:blur(2px);
  }
  #toc-overlay.show{ display:block; }
  #toc-panel{
    position:fixed; top:0; bottom:0; width:min(340px, 84vw);
    background:linear-gradient(180deg, #0d3527 0%, #081f17 100%);
    border-inline-start:1px solid rgba(184,147,75,.3);
    box-shadow:-30px 0 60px rgba(0,0,0,.4);
    padding:20px 18px 20px;
    overflow-y:auto;
    inset-inline-end:0;
  }
  #toc-panel h2{
    font-family:'Rakkas', serif; color:var(--gold-bright); font-size:1.15rem;
    margin:4px 0 16px; padding-bottom:12px; border-bottom:1px solid rgba(184,147,75,.25);
  }
  .toc-empty{ color:var(--sage); font-size:.85rem; font-family:'Inter',sans-serif; direction:ltr; text-align:start; }
  .toc-list{ list-style:none; margin:0; padding:0; }
  .toc-list ul{ list-style:none; padding-inline-start:16px; margin:2px 0 2px; }
  .toc-item{
    display:block; width:100%; text-align:start; background:none; border:none;
    color:var(--parchment); font-family:'Amiri', serif; font-size:.95rem;
    padding:7px 4px; cursor:pointer; border-radius:4px; line-height:1.4;
  }
  .toc-item:hover{ background:rgba(184,147,75,.15); color:var(--gold-bright); }

  /* ---------- No-file state ---------- */
  #empty-state{
    position:fixed; inset:0; z-index:10;
    display:none; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; padding:40px;
  }
  #empty-state.show{ display:flex; }
  #empty-state h1{ font-family:'Rakkas',serif; color:var(--ink-green); font-size:1.6rem; margin:0 0 10px; }
  #empty-state p{ font-family:'Inter',sans-serif; color:#7a6a4a; max-width:420px; line-height:1.6; font-size:.9rem; direction:ltr; }
  #empty-state code{ background:rgba(184,147,75,.15); padding:2px 7px; border-radius:4px; color:var(--ink-green); }

  @media (max-width:640px){
    #book-title{ font-size:.9rem; }
    input[type=range]{ width:110px; }
    #stage{ padding:60px 4px 90px; }
    #topbar > div{ gap:6px !important; }
    .icon-btn{ width:34px; height:34px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="ornament"></div>
  <div id="loading-text">جارٍ تحميل الكتاب</div>
  <div id="loading-sub">Preparing pages…</div>
  <div id="progress-track"><div id="progress-bar"></div></div>
</div>

<div id="topbar">
  <a id="book-title" href="https://a-alqasim.com/" target="_blank" rel="noopener">كتب مجلس السماع<span>a-alqasim.com</span></a>
  <div style="display:flex; gap:8px;">
    <button class="icon-btn" id="btn-toc" title="Table of contents" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
    </button>
    <a class="icon-btn" id="btn-download" title="Download PDF" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
    </a>
    <button class="icon-btn" id="btn-fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </div>
</div>

<div id="stage">
  <div id="flip-outer">
    <div id="flipbook"></div>
  </div>
</div>

<div id="empty-state">
  <h1>لا يوجد كتاب محمّل — No book loaded</h1>
  <p>Place your PDF next to this file and name it <code>book.pdf</code>, or add <code>?pdf=yourfile.pdf</code> to the URL. See README.md for full GitHub Pages deployment steps.</p>
</div>

<div id="toc-overlay">
  <div id="toc-panel">
    <h2>الفهرس — Contents</h2>
    <div id="toc-body"><div class="toc-empty">Loading…</div></div>
  </div>
</div>

<div id="bottombar">
  <button class="icon-btn" id="btn-prev" title="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div id="page-indicator"><b id="cur-page" title="Click to jump to a page">1</b><input type="number" id="page-input" min="1"> / <span id="total-pages">—</span></div>
  <input type="range" id="page-slider" min="1" max="1" value="1">
  <button class="icon-btn" id="btn-next" title="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
(function(){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const params = new URLSearchParams(location.search);
  const PDF_URL = params.get('pdf') || 'book.pdf';
  const DISABLE_MIRROR = params.get('mirror') === '0';
  // Base render resolution, boosted for high-DPI (retina) screens so the
  // PDF's vector content stays crisp without needing any zoom feature —
  // capped at 2x device pixel ratio to keep memory reasonable across a
  // 1000+ page book.
  const RENDER_SCALE = 2.0 * Math.min(window.devicePixelRatio || 1, 2);

  const loadingEl = document.getElementById('loading');
  const progressBar = document.getElementById('progress-bar');
  const loadingSub = document.getElementById('loading-sub');
  const emptyState = document.getElementById('empty-state');
  const flipOuterEl = document.getElementById('flip-outer');
  const stageEl = document.getElementById('stage');
  const curPageEl = document.getElementById('cur-page');
  const pageInput = document.getElementById('page-input');
  const totalPagesEl = document.getElementById('total-pages');
  const slider = document.getElementById('page-slider');
  const tocOverlay = document.getElementById('toc-overlay');
  const tocBody = document.getElementById('toc-body');
  const btnToc = document.getElementById('btn-toc');

  let flipbookEl = document.getElementById('flipbook');
  let pageFlip = null;
  let numPages = 0;
  let dir = 'ltr';
  let pdfDoc = null;
  let pdfAspect = 0.72;
  let pageDivs = [];
  let currentLogicalIdx = 0;

  const renderedPages = new Set(); // logical indices currently holding a rendered canvas

  // ---- Lazy loading strategy for very large books (this PDF: 1124 pages) ----
  // Load the first 50 pages up front (page 1 shows the instant it's ready,
  // the rest of that batch renders in the background), then keep buffering
  // 25 pages ahead of wherever the reader currently is. Pages far BEHIND
  // the current position are evicted back to placeholders to keep memory
  // bounded even after reading hundreds of pages forward.
  const INITIAL_BATCH = 50;
  const PREFETCH_CHUNK = 25;
  // How many rendered pages to keep behind the current position before
  // evicting them. Raised generously so pages "stay loaded" for normal
  // reading sessions, but NOT unlimited — fully caching a 1124-page book
  // at retina resolution would be several GB of canvas memory, which
  // mobile Safari in particular will kill the tab over. This is a safety
  // net, not a hard limit you're expected to hit in ordinary use.
  const KEEP_BEHIND = 150;
  const HARD_CAP = 200;
  let loadedUpTo = -1;

  const RTL_SCRIPT = /[\u0591-\u07FF\uFB1D-\uFDFD\uFE70-\uFEFC]/g;
  const LTR_SCRIPT = /[A-Za-z]/g;
  const RTL_LANGS = ['ar','he','fa','ur','yi','ps','sd','ug'];

  async function detectDirection(pdf) {
    try {
      const vp = await pdf.getViewerPreferences?.();
      if (vp && vp.Direction) return vp.Direction === 'R2L' ? 'rtl' : 'ltr';
    } catch (e) {}

    try {
      let rtlCount = 0, ltrCount = 0, docLang = null;
      const pagesToSample = Math.min(pdf.numPages, 3);
      for (let i = 1; i <= pagesToSample; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        if (!docLang && tc.lang) docLang = tc.lang.toLowerCase();
        const text = tc.items.map(it => it.str).join(' ');
        rtlCount += (text.match(RTL_SCRIPT) || []).length;
        ltrCount += (text.match(LTR_SCRIPT) || []).length;
      }
      if (docLang && RTL_LANGS.some(l => docLang.startsWith(l))) return 'rtl';
      if (rtlCount + ltrCount > 0) return rtlCount > ltrCount ? 'rtl' : 'ltr';
    } catch (e) {}

    return 'ltr';
  }

  async function renderPageAt(pdf, logicalIdx0, scale) {
    const page = await pdf.getPage(logicalIdx0 + 1);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    if (dir === 'rtl' && !DISABLE_MIRROR) canvas.style.transform = 'scaleX(-1)';
    return canvas;
  }

  async function ensurePageRendered(pdf, logicalIdx0) {
    if (logicalIdx0 < 0 || logicalIdx0 >= numPages) return;
    if (renderedPages.has(logicalIdx0)) return;
    const canvas = await renderPageAt(pdf, logicalIdx0, RENDER_SCALE);
    const el = pageDivs[logicalIdx0];
    if (!el) return; // book may have been rebuilt (resize) mid-render
    el.innerHTML = '';
    el.appendChild(canvas);
    renderedPages.add(logicalIdx0);
  }

  function trimBehind(centerIdx) {
    const lowerBound = centerIdx - KEEP_BEHIND;
    for (const idx of [...renderedPages]) {
      if (idx < lowerBound) {
        pageDivs[idx].innerHTML = '<div class="page-loading">…</div>';
        renderedPages.delete(idx);
      }
    }
    if (renderedPages.size > HARD_CAP) {
      const farthestFirst = [...renderedPages].sort(
        (a, b) => Math.abs(b - centerIdx) - Math.abs(a - centerIdx)
      );
      for (const idx of farthestFirst) {
        if (renderedPages.size <= HARD_CAP) break;
        pageDivs[idx].innerHTML = '<div class="page-loading">…</div>';
        renderedPages.delete(idx);
      }
    }
  }

  async function prefetchForward(pdf, targetIdx, onProgress) {
    targetIdx = Math.min(targetIdx, numPages - 1);
    const total = Math.max(1, targetIdx - loadedUpTo);
    let done = 0;
    for (let i = loadedUpTo + 1; i <= targetIdx; i++) {
      await ensurePageRendered(pdf, i);
      loadedUpTo = Math.max(loadedUpTo, i);
      trimBehind(currentLogicalIdx);
      done++;
      if (onProgress) onProgress(done, total);
    }
  }

  function maybeExtendFrontier(pdf, centerIdx) {
    if (centerIdx + PREFETCH_CHUNK >= loadedUpTo) {
      prefetchForward(pdf, loadedUpTo + PREFETCH_CHUNK); // background
    }
  }

  // Renders the target page AND its immediate neighbors. Just rendering
  // the target wasn't enough: in a two-page spread, the page sitting next
  // to it also needs to be rendered, or it shows blank until the NEXT
  // flip happens to render it as a side effect of ITS OWN target.
  async function onPageChanged(pdf, logicalIdx0) {
    currentLogicalIdx = logicalIdx0;
    await ensurePageRendered(pdf, logicalIdx0);
    await ensurePageRendered(pdf, logicalIdx0 - 1);
    await ensurePageRendered(pdf, logicalIdx0 + 1);
    maybeExtendFrontier(pdf, logicalIdx0);
    trimBehind(logicalIdx0);
  }

  // Pages are always fed to the library in natural order; "forward" is
  // always flipNext(). Mirroring the container (see #flip-outer) is what
  // makes this look/behave RTL — reversing the array too was tried
  // earlier and was the actual bug, since it fought with the mirror
  // instead of complementing it.
  // Pre-render the target page BEFORE actually flipping to it — without
  // this, fast repeated flipping could outrun the lazy-render pipeline and
  // briefly show a blank page (flipNext/flipPrev switch the visible index
  // immediately; rendering used to only start afterward).
  async function goForward() {
    const target = Math.min(numPages - 1, currentLogicalIdx + 1);
    await ensurePageRendered(pdfDoc, target);
    pageFlip.flipNext();
  }
  async function goBackward() {
    const target = Math.max(0, currentLogicalIdx - 1);
    await ensurePageRendered(pdfDoc, target);
    pageFlip.flipPrev();
  }

  async function jumpToLogical(logicalIdx0, animate) {
    logicalIdx0 = Math.max(0, Math.min(numPages - 1, logicalIdx0));
    const bigJump = Math.abs(logicalIdx0 - currentLogicalIdx) > 3;
    // Render the target plus its spread neighbor before jumping — a big
    // jump (e.g. typing "500" and hitting Enter) used to animate toward a
    // page that had no canvas yet, which looked like it "didn't display".
    await ensurePageRendered(pdfDoc, logicalIdx0);
    await ensurePageRendered(pdfDoc, logicalIdx0 - 1);
    await ensurePageRendered(pdfDoc, logicalIdx0 + 1);
    if (animate === false || bigJump) pageFlip.turnToPage(logicalIdx0);
    else pageFlip.flip(logicalIdx0);
    onPageChanged(pdfDoc, logicalIdx0);
  }

  // ---- Custom click/swipe handling ----
  // StPageFlip's own built-in click-to-flip and drag-to-swipe use the
  // pointer's LOCAL position within the page element, which CSS mirroring
  // does not affect (CSS transforms change how something is drawn on
  // screen, not the coordinate math a script does internally) — so with
  // the library's own gesture handling left on, clicking/swiping stayed
  // backwards for RTL even after the visual mirror was fixed. Library
  // gesture handling is disabled (useMouseEvents:false in buildBook) and
  // replaced with this, which measures against the actual on-screen
  // (mirrored) position via getBoundingClientRect, so it's correct in
  // both directions.
  function isVisualForwardSide(clientX) {
    const rect = flipbookEl.getBoundingClientRect();
    const relX = clientX - rect.left;
    const clickedLeftHalf = relX < rect.width / 2;
    // For an RTL book, forward is the LEFT side (and dragging left-to-right).
    // For an LTR book, forward is the RIGHT side (and dragging right-to-left).
    return dir === 'rtl' ? clickedLeftHalf : !clickedLeftHalf;
  }

  function setupGestures() {
    let startX = null, startY = null;
    flipbookEl.addEventListener('pointerdown', (e) => {
      startX = e.clientX; startY = e.clientY;
    });
    flipbookEl.addEventListener('pointerup', (e) => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = null;
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
        // Tap/click: which half of the book was it on?
        isVisualForwardSide(e.clientX) ? goForward() : goBackward();
      } else if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        // Swipe: dragged left-to-right (dx>0) or right-to-left (dx<0)?
        const draggedLeftToRight = dx > 0;
        const isForwardDrag = dir === 'rtl' ? draggedLeftToRight : !draggedLeftToRight;
        isForwardDrag ? goForward() : goBackward();
      }
    });
    flipbookEl.addEventListener('pointercancel', () => { startX = null; });
  }

  function replaceFlipbookElement() {
    const fresh = document.createElement('div');
    fresh.id = 'flipbook';
    flipbookEl.replaceWith(fresh);
    flipbookEl = fresh;
    return fresh;
  }

  // Builds the flip book ONCE, using StPageFlip's own 'stretch' sizing mode
  // instead of a fixed pixel size we compute and then have to destroy and
  // recreate on every resize/rotation. 'stretch' mode is the library's own
  // built-in mechanism for staying correctly sized (and switching between
  // single-page/portrait and two-page/spread automatically) as its
  // container resizes — after three rounds of the hand-rolled
  // destroy-and-rebuild approach breaking in new ways on fullscreen and
  // orientation change, this is a deliberate switch to let the library
  // handle its own responsiveness instead of us reimplementing it.
  async function buildBook(pdf, targetLogicalIdx) {
    if (pageFlip) { try { pageFlip.destroy(); } catch (e) {} }
    replaceFlipbookElement();

    // Base aspect-correct size — 'stretch' mode uses this as its reference
    // ratio, then fits within min/max bounds based on the container's
    // actual size, recalculating on its own as that container resizes.
    const baseHeight = 600;
    const baseWidth = Math.round(baseHeight * pdfAspect);

    pageFlip = new St.PageFlip(flipbookEl, {
      width: baseWidth,
      height: baseHeight,
      size: 'stretch',
      minWidth: 220, maxWidth: 900,
      minHeight: Math.round(220 / pdfAspect), maxHeight: Math.round(900 / pdfAspect),
      showCover: true,
      usePortrait: true, // let the library decide single vs. spread as it resizes
      autoSize: false,   // the book fits ITS container; the container doesn't resize to fit the book
      maxShadowOpacity: 0.5,
      mobileScrollSupport: true,
      useMouseEvents: false, // replaced with setupGestures() — see comment there
      drawShadow: true,
      flippingTime: 700
    });

    pageDivs = [];
    for (let i = 0; i < numPages; i++) {
      const placeholder = document.createElement('div');
      placeholder.className = 'page';
      placeholder.innerHTML = '<div class="page-loading">…</div>';
      pageDivs.push(placeholder);
    }
    pageFlip.loadFromHTML(pageDivs);
    renderedPages.clear();
    loadedUpTo = -1;

    pageFlip.on('flip', (e) => {
      const logicalIdx0 = e.data;
      curPageEl.textContent = logicalIdx0 + 1;
      slider.value = logicalIdx0 + 1;
      onPageChanged(pdf, logicalIdx0);
    });

    setupGestures();

    await ensurePageRendered(pdf, targetLogicalIdx);
    currentLogicalIdx = targetLogicalIdx;
    if (targetLogicalIdx > 0) pageFlip.turnToPage(targetLogicalIdx);
    loadedUpTo = targetLogicalIdx;
    curPageEl.textContent = targetLogicalIdx + 1;
    slider.value = targetLogicalIdx + 1;
  }

  async function buildTOC(pdf) {
    let outline;
    try { outline = await pdf.getOutline(); } catch (e) { outline = null; }
    if (!outline || outline.length === 0) {
      tocBody.innerHTML = '<div class="toc-empty">This PDF has no bookmarks/outline to build a table of contents from.</div>';
      return;
    }
    btnToc.disabled = false;

    async function resolve(nodes) {
      const ul = document.createElement('ul');
      ul.className = 'toc-list';
      for (const node of nodes) {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'toc-item';
        btn.textContent = node.title || '(untitled)';

        let logicalIdx0 = null;
        try {
          let dest = node.dest;
          if (typeof dest === 'string') dest = await pdf.getDestination(dest);
          if (Array.isArray(dest) && dest[0] != null) {
            logicalIdx0 = await pdf.getPageIndex(dest[0]);
          }
        } catch (e) {}

        if (logicalIdx0 !== null) {
          btn.addEventListener('click', () => {
            jumpToLogical(logicalIdx0);
            tocOverlay.classList.remove('show');
          });
        } else {
          btn.disabled = true;
          btn.style.opacity = '.4';
        }
        li.appendChild(btn);
        if (node.items && node.items.length) li.appendChild(await resolve(node.items));
        ul.appendChild(li);
      }
      return ul;
    }

    tocBody.innerHTML = '';
    tocBody.appendChild(await resolve(outline));
  }

  async function init() {
    let pdf;
    try {
      pdf = await pdfjsLib.getDocument(PDF_URL).promise;
    } catch (e) {
      loadingEl.classList.add('hide');
      emptyState.classList.add('show');
      console.error('Could not load PDF:', e);
      return;
    }
    pdfDoc = pdf;

    numPages = pdf.numPages;
    totalPagesEl.textContent = numPages;
    slider.max = numPages;

    const forcedDir = params.get('dir');
    dir = (forcedDir === 'rtl' || forcedDir === 'ltr') ? forcedDir : await detectDirection(pdf);
    document.documentElement.setAttribute('dir', dir);
    flipOuterEl.style.setProperty('--mirror-x', (dir === 'rtl' && !DISABLE_MIRROR) ? -1 : 1);
    loadingSub.textContent = 'جاري التحميل...';

    const firstPage = await pdf.getPage(1);
    const vp1 = firstPage.getViewport({ scale: 1 });
    pdfAspect = vp1.width / vp1.height;

    loadingSub.textContent = 'جاري التحميل...';
    await buildBook(pdf, 0);
    // Load a real initial batch (with a genuine percentage, not just page 1)
    // before revealing the book — the reader is looking at a fully-usable
    // opening chunk once this finishes, not just a lone first page.
    const firstBatchTarget = Math.min(INITIAL_BATCH - 1, numPages - 1);
    await prefetchForward(pdf, firstBatchTarget, (done, total) => {
      const pct = Math.round((done / total) * 100);
      progressBar.style.width = pct + '%';
      loadingSub.textContent = `جاري التحميل... ${pct}٪`;
    });
    loadingEl.classList.add('hide');

    document.getElementById('btn-next').onclick = goForward;
    document.getElementById('btn-prev').onclick = goBackward;

    const downloadLink = document.getElementById('btn-download');
    downloadLink.href = PDF_URL;
    downloadLink.download = PDF_URL.split('/').pop().split('?')[0] || 'book.pdf';

    slider.addEventListener('input', () => {
      jumpToLogical(parseInt(slider.value, 10) - 1);
    });

    curPageEl.addEventListener('click', () => {
      pageInput.max = numPages;
      pageInput.value = curPageEl.textContent;
      curPageEl.style.display = 'none';
      pageInput.style.display = 'inline-block';
      pageInput.focus();
      pageInput.select();
    });
    function commitPageInput() {
      const v = parseInt(pageInput.value, 10);
      pageInput.style.display = 'none';
      curPageEl.style.display = '';
      if (!isNaN(v)) jumpToLogical(v - 1);
    }
    pageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commitPageInput();
      if (e.key === 'Escape') { pageInput.style.display = 'none'; curPageEl.style.display = ''; }
    });
    pageInput.addEventListener('blur', commitPageInput);

    // Right/left arrow keys always mean "forward"/"back" in reading order,
    // which is the OPPOSITE screen direction for an RTL book.
    // preventDefault matters here: the page slider is a native <input
    // type="range">, which responds to arrow keys on its own when
    // focused — without this, a single keypress could both move the
    // slider (firing jumpToLogical via its own 'input' listener) AND
    // trigger goForward/goBackward here, moving two pages at once.
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === pageInput) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); dir === 'rtl' ? goBackward() : goForward(); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); dir === 'rtl' ? goForward() : goBackward(); }
    });

    // Mobile browsers can silently discard already-rendered canvas content
    // while a tab is backgrounded (screen lock, app-switching) to save
    // memory — the page has no way to know this happened on its own. When
    // the tab becomes visible again, treat everything as unrendered and
    // immediately redraw what's currently on screen; the rest self-heals
    // lazily as the reader keeps navigating, same as any other lazy page.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && pdfDoc) {
        renderedPages.clear();
        loadedUpTo = -1;
        onPageChanged(pdfDoc, currentLogicalIdx);
      }
    });

    // Rebuilding the book (destroy + recreate) is what breaks it if
    // triggered at the wrong moment — that's exactly what was happening on
    // fullscreen enter/exit (F11 or the button), which resizes the
    // viewport but does NOT change portrait/landscape. So: only rebuild
    // when the orientation genuinely flips (actual device rotation).
    // Fullscreen and ordinary window resizing now just leave the existing
    // book as-is rather than risk breaking it — it won't perfectly re-fill
    // the new space, but it also won't disappear.
    // Rebuilding the book (destroy + recreate) is what breaks it if
    // triggered at the wrong moment — that's exactly what was happening on
    // fullscreen enter/exit (F11 or the button), which resizes the
    // 'stretch' mode (see buildBook) is supposed to handle resizing and
    // portrait/landscape switching on its own, without us destroying and
    // recreating anything. This is a safety net in case that ever doesn't
    // happen correctly on some device/browser: after a resize settles,
    // check whether the book still has a real, non-zero size, and only
    // rebuild if it doesn't — rebuilding unconditionally on every resize
    // is exactly the pattern that kept breaking fullscreen and rotation in
    // earlier versions.
    let resizeTimer;
    async function robustRebuild(attempt) {
      attempt = attempt || 1;
      try {
        await buildBook(pdfDoc, currentLogicalIdx);
        prefetchForward(pdfDoc, Math.min(currentLogicalIdx + INITIAL_BATCH - 1, numPages - 1));
        if (!flipbookEl.offsetWidth || !flipbookEl.offsetHeight) {
          throw new Error('book has zero size after rebuild');
        }
      } catch (e) {
        console.error('[flipbook] rebuild attempt ' + attempt + ' failed:', e);
        if (attempt < 5) setTimeout(() => robustRebuild(attempt + 1), 300 * attempt);
      }
    }
    function checkStillHealthy(delay) {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (!flipbookEl.offsetWidth || !flipbookEl.offsetHeight) robustRebuild();
      }, delay);
    }
    window.addEventListener('resize', () => checkStillHealthy(400));
    window.addEventListener('orientationchange', () => checkStillHealthy(600));

    // Last-resort manual recovery: if the book area is ever tapped while
    // it has no visible content, rebuild once more right away.
    stageEl.addEventListener('pointerup', () => {
      if (pdfDoc && (!flipbookEl.offsetWidth || !flipbookEl.offsetHeight)) robustRebuild();
    });

    buildTOC(pdf);
  }

  // Many mobile browsers — iOS Safari in particular — don't support the
  // Fullscreen API for arbitrary page content (only for <video>). Rather
  // than show a button that silently does nothing there, hide it when
  // unsupported. Vendor-prefixed fallbacks cover older/other browsers that
  // support it under a different method name.
  const btnFullscreen = document.getElementById('btn-fullscreen');
  const docEl = document.documentElement;
  const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
  const exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

  if (!requestFS) {
    btnFullscreen.style.display = 'none';
  } else {
    btnFullscreen.onclick = () => {
      try {
        if (!fsElement()) requestFS.call(docEl).catch?.(() => {});
        else exitFS.call(document).catch?.(() => {});
      } catch (e) { console.error('[flipbook] fullscreen toggle failed:', e); }
    };
  }
  btnToc.addEventListener('click', () => tocOverlay.classList.add('show'));
  tocOverlay.addEventListener('click', (e) => {
    if (e.target === tocOverlay) tocOverlay.classList.remove('show');
  });

  init();
})();
</script>

</body>
</html>
